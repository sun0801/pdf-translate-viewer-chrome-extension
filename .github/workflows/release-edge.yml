name: Publish Edge v0.8.5

on:
  push:
    tags: ["edge-v0.8.5"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release version
        run: |
          test "$GITHUB_REF_NAME" = "edge-v0.8.5"
          test "$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")" = "0.8.5"
      - run: npm ci
      - run: npm run check
      - run: npm run package:edge
      - name: Create distribution ZIP
        working-directory: dist/edge
        run: zip -q -r ../pdf-translate-viewer-edge-v0.8.5.zip .
      - name: Create checksum
        working-directory: dist
        run: sha256sum pdf-translate-viewer-edge-v0.8.5.zip > SHA256SUMS.txt
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/pdf-translate-viewer-edge-v0.8.5.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Edge版 v0.8.5" --notes-file .github/EDGE_RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
